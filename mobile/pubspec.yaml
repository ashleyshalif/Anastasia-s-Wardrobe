name: rynas_wardrobe_mobile
description: Luxury Atelier E-Commerce Mobile Application for Ryna's Wardrobe
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Networking & REST API
  http: ^1.2.0

  # State Management
  provider: ^6.1.1

  # Caching & Image Loading
  cached_network_image: ^3.3.1

  # Typography & Icons
  google_fonts: ^6.1.0
  intl: ^0.19.0
  lucide_icons: ^0.257.0

  # Local Storage for Cart & Auth Token
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

